name: Publicar imagem Docker (GHCR)

# Builda a imagem GENÉRICA do app e publica no GitHub Container Registry.
# O leigo puxa essa imagem no VPS (não builda lá). Roda nos runners do GitHub,
# então o build pesado (~6min) nunca cai no VPS do usuário.

on:
  push:
    tags: ["v*"]
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Dois merges seguidos não disputam a `:latest`: o segundo ESPERA o primeiro
# terminar, e a execução em andamento nunca é cancelada (imagem pela metade
# publicada seria pior). Limite do GitHub: só UMA execução fica pendente por
# grupo. Com três merges seguidos, a do meio é descartada e aquele commit fica
# sem imagem própria; a `:latest` final continua sendo a do último merge.
concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    # Medido: ~3 min com cache. Sem teto, um build travado segura o runner por 6 h.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build e push (imagem genérica — sem segredos)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # linux/amd64: o VPS HostGator e a imagem do WAHA são amd64.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Sem build-args de segredo: a imagem é genérica (NEXT_PUBLIC_* viram
          # placeholder; valores reais entram em runtime no VPS do usuário).
