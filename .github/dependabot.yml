version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # O runtime é Node 22 (.nvmrc, engines, CI): tipos de um Node mais novo
      # descrevem APIs que não existem aqui e escondem erro. Só patch/minor.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    # "/" cobre .github/workflows; a action local de preparo fica em outra pasta
    # e, sem a segunda entrada, os SHAs fixados nela nunca seriam atualizados.
    directories:
      - "/"
      - "/.github/actions/setup"
    schedule:
      interval: "weekly"
