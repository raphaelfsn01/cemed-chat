# Supabase CLI config — CEMED Chat
# Docs: https://supabase.com/docs/guides/cli/config
# Este arquivo é versionado. Segredos vivem em .env.local / Vercel.

project_id = "deskcomm-crm"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/confirm",
  "http://localhost:3001/auth/confirm",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Cadastro público DESLIGADO, como deve estar em produção (auditoria de 2026-10-21, C3):
# conta nova só nasce do convite, pela API admin (service role). Com isto, o e2e do
# CI prova em toda execução que o primeiro acesso pelo convite funciona sem signup.
enable_signup = false

[auth.email]
# NÃO desligar: aqui esta chave liga o PROVEDOR de e-mail (login com senha). O que
# barra cadastro novo é o `enable_signup` de [auth], acima. Medido: com false aqui,
# o GoTrue responde "Email logins are disabled" a todo login.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Templates apontam para /auth/confirm (fluxo token_hash do @supabase/ssr).
# Self-host GoTrue: ver docs/deploy-selfhost (GOTRUE_MAILER_TEMPLATES_*).
[auth.email.template.confirmation]
subject = "Confirme seu e-mail — CEMED Saúde"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Redefinir senha — CEMED Saúde"
content_path = "./supabase/templates/recovery.html"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = false # Não usamos Edge Functions no MVP
policy = "oneshot"

[analytics]
enabled = false
